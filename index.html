<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="论文分析与阅读笔记">
  <title>论文分析 · Paper Management</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f7f8fb; color: #1e293b; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 820px; margin: 0 auto; padding: 72px 24px; }
    .eyebrow { color: #4f46e5; font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { font-size: clamp(36px, 7vw, 56px); letter-spacing: -.04em; margin: 12px 0 16px; }
    .intro { color: #475569; font-size: 18px; line-height: 1.7; }
    section { margin-top: 48px; background: #fff; border: 1px solid #e2e8f0; border-radius: 18px; padding: 28px; }
    h2 { margin: 0 0 12px; font-size: 22px; }
    p { line-height: 1.7; }
    .empty { color: #64748b; margin-bottom: 0; }
    footer { margin-top: 48px; color: #64748b; font-size: 14px; }
    a { color: #4338ca; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Paper Management</div>
    <h1>论文分析</h1>
    <p class="intro">这里将收录论文阅读与分析页面，方便公开浏览和分享。</p>
    <section aria-labelledby="papers-title">
      <h2 id="papers-title">文章目录</h2>
      <p class="empty">内容正在整理中。第一篇 HTML 论文分析发布后，将在这里提供入口。</p>
    </section>
    <footer>托管于 <a href="https://github.com/xiaoshu12/paper-management">GitHub</a></footer>
  </main>
</body>
</html>
